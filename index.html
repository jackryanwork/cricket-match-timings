<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cricket Match Timings</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #07111f;
            --card: #0d1b2d;
            --card-light: #12243a;
            --text: #ffffff;
            --muted: #91a0b5;
            --accent: #19c37d;
            --border: rgba(255,255,255,0.08);
        }

        body {
            margin: 0;
            background: var(--bg);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button {
            font-family: inherit;
        }

        .app {
            max-width: 600px;
            margin: auto;
            padding: 16px 14px 30px;
        }

        .pull-indicator {
            height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            opacity: 0;
            transition: height 0.18s ease, opacity 0.18s ease;
        }

        .pull-indicator.visible {
            height: 34px;
            opacity: 1;
        }

        .pull-indicator.ready {
            color: var(--accent);
        }

        /* HEADER */

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #19c37d, #087f55);
            font-size: 25px;
            box-shadow: 0 7px 18px rgba(25,195,125,0.20);
        }

        .brand h1 {
            margin: 0;
            font-size: 18px;
            font-weight: 800;
        }

        .brand p {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 11px;
        }

        .notification {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            color: var(--text);
            font-size: 18px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }

        .menu-button {
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card);
            color: var(--text);
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
        }

        .menu-panel {
            display: none;
            position: absolute;
            z-index: 10;
            top: 50px;
            right: 0;
            width: 210px;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: #102238;
            box-shadow: 0 18px 35px rgba(0, 0, 0, 0.30);
        }

        .menu-panel.open {
            display: block;
        }

        .menu-title {
            padding: 8px 10px 10px;
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.9px;
            text-transform: uppercase;
        }

        .menu-item {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 0;
            border-radius: 10px;
            padding: 11px 10px;
            background: transparent;
            color: var(--text);
            font-size: 13px;
            text-align: left;
        }

        .menu-item span:last-child {
            color: var(--muted);
            font-size: 10px;
        }

        /* WELCOME */

        .welcome {
            background: linear-gradient(135deg, #0d2d28, #0d1b2d);
            border: 1px solid rgba(25,195,125,0.15);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .welcome-label {
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .welcome h2 {
            margin: 7px 0 5px;
            font-size: 22px;
        }

        .welcome p {
            margin: 0;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.5;
        }

        /* FEATURED NEXT MATCH */

        .featured-match {
            display: none;
            overflow: hidden;
            margin-bottom: 18px;
            border: 1px solid rgba(25, 195, 125, 0.28);
            border-radius: 20px;
            background: linear-gradient(135deg, #123a31, #102238 68%);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.18);
        }

        .featured-match.visible {
            display: block;
        }

        .featured-label {
            display: inline-flex;
            margin: 14px 14px 0;
            padding: 6px 9px;
            border-radius: 999px;
            background: rgba(25, 195, 125, 0.16);
            color: var(--accent);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .featured-teams {
            padding: 14px 16px 8px;
            font-size: 19px;
            font-weight: 800;
            line-height: 1.25;
        }

        .featured-meta {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 0 16px 16px;
            color: var(--muted);
            font-size: 12px;
        }

        .featured-meta span:last-child {
            text-align: right;
        }

        .featured-countdown {
            margin: 0 12px 12px;
            padding: 12px;
            border-radius: 13px;
            background: rgba(7, 17, 31, 0.38);
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }

        .big-match-stack {
            position: relative;
            margin-top: 4px;
            margin-bottom: 16px;
            isolation: isolate;
        }

        .big-match-stack::before,
        .big-match-stack::after {
            content: "";
            position: absolute;
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.10);
            border-radius: 0 0 16px 16px;
            background: #10283a;
        }

        .big-match-stack::before {
            z-index: -1;
            inset: 8px 10px -8px;
            opacity: 0.86;
        }

        .big-match-stack::after {
            z-index: -2;
            inset: 16px 20px -16px;
            opacity: 0.62;
        }

        .featured-match.expanded .big-match-stack {
            margin-bottom: 0;
        }

        .featured-match.expanded .big-match-stack::before,
        .featured-match.expanded .big-match-stack::after {
            display: none;
        }

        .big-match-toggle {
            display: block;
            margin: 2px 16px 13px;
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            text-align: center;
        }

        .big-match-card {
            border-top: 1px solid rgba(255, 255, 255, 0.10);
            cursor: pointer;
        }

        .big-match-card:not(:first-child) {
            display: none;
        }

        .featured-match.expanded .big-match-card {
            display: block;
            animation: reveal-big-match 0.22s ease-out;
        }

        @keyframes reveal-big-match {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* FILTERS */

        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 20px;
        }

        .filter {
            flex-shrink: 0;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--muted);
            padding: 10px 15px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }

        .filter.active {
            color: #06140f;
        }

        .filter.today.active {
            background: #19c37d;
            border-color: #19c37d;
        }

        .filter.tomorrow.active {
            background: #64a5ff;
            border-color: #64a5ff;
            color: #07111f;
        }

        .filter.upcoming.active {
            background: #b58cff;
            border-color: #b58cff;
            color: #160d2a;
        }

        .match-tools {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: -5px 0 12px;
        }

        .last-updated {
            color: var(--muted);
            font-size: 11px;
        }

        .refresh-button {
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 7px 10px;
            background: var(--card);
            color: var(--text);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .refresh-button:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        /* SECTION */

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 11px;
        }

        .section-header h3 {
            margin: 0;
            font-size: 17px;
        }

        .section-header span {
            color: var(--muted);
            font-size: 11px;
        }

        /* LIVE CARD */

        .live-card {
            background: linear-gradient(135deg, #132b27, #0d1b2d);
            border: 1px solid rgba(25,195,125,0.22);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .live-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ff5c5c;
            font-size: 11px;
            font-weight: 800;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ff5c5c;
        }

        .competition {
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .live-teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: center;
        }

        .live-team {
            width: 38%;
        }

        .team-flag {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .team-name {
            font-size: 14px;
            font-weight: 800;
        }

        .score {
            margin-top: 5px;
            font-size: 12px;
            color: var(--muted);
        }

        .live-vs {
            font-size: 11px;
            color: var(--muted);
            font-weight: 800;
        }

        /* MATCH CARD */

        .match-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 17px;
            padding: 15px;
            margin-bottom: 11px;
        }

        .match-card[data-match-id] {
            cursor: pointer;
            transition: transform 0.16s ease, border-color 0.16s ease;
        }

        .match-card[data-match-id]:active {
            transform: scale(0.985);
            border-color: rgba(25, 195, 125, 0.45);
        }

        .match-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .match-type {
            color: var(--accent);
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .match-status {
            padding: 5px 8px;
            border-radius: 7px;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 0.4px;
        }

        .match-status.today {
            background: rgba(25,195,125,0.14);
            color: var(--accent);
        }

        .match-status.upcoming {
            background: rgba(145,160,181,0.12);
            color: #c0cad8;
        }

        .teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-align: center;
        }

        .team {
            width: 40%;
        }

        .team-logo {
            font-size: 27px;
            margin-bottom: 6px;
        }

        .team-name-card {
            font-size: 13px;
            font-weight: 750;
        }

        .vs {
            color: var(--muted);
            font-size: 10px;
            font-weight: 800;
        }

        .match-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            margin-top: 14px;
            padding-top: 12px;
        }

        .match-time {
            font-size: 15px;
            font-weight: 800;
        }

        .timezone {
            color: var(--muted);
            font-size: 9px;
            margin-left: 3px;
        }

        .venue {
            color: var(--muted);
            font-size: 10px;
        }

        /* FOOTER */

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #627188;
            font-size: 10px;
        }

        .match-modal {
            display: none;
            position: fixed;
            z-index: 20;
            inset: 0;
            align-items: flex-end;
            background: rgba(2, 8, 16, 0.72);
        }

        .match-modal.open {
            display: flex;
        }

        .match-modal-sheet {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 14px 16px 30px;
            border: 1px solid var(--border);
            border-radius: 24px 24px 0 0;
            background: #0d1b2d;
            box-shadow: 0 -16px 36px rgba(0, 0, 0, 0.28);
        }

        .modal-handle {
            width: 38px;
            height: 4px;
            margin: 0 auto 14px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.20);
        }

        .modal-close {
            float: right;
            width: 34px;
            height: 34px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card-light);
            color: var(--text);
            font-size: 18px;
        }

        .detail-tournament {
            margin: 0 42px 7px 0;
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.7px;
            text-transform: uppercase;
        }

        .detail-teams {
            margin: 0 42px 20px 0;
            font-size: 21px;
            font-weight: 800;
            line-height: 1.25;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 13px 0;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
        }

        .detail-row strong {
            color: var(--text);
            font-size: 13px;
            text-align: right;
        }

        .detail-reminder {
            width: 100%;
            margin-top: 18px;
            border: 1px solid rgba(25, 195, 125, 0.22);
            border-radius: 12px;
            padding: 12px;
            background: rgba(25, 195, 125, 0.08);
            color: var(--muted);
            font: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .detail-reminder:disabled {
            cursor: wait;
            opacity: 0.72;
        }

        .welcome-celebration {
            display: none;
            position: fixed;
            z-index: 30;
            inset: 0;
            align-items: center;
            justify-content: center;
            padding: 22px;
            background: rgba(2, 8, 16, 0.78);
        }

        .welcome-celebration.open {
            display: flex;
        }

        .welcome-celebration-card {
            position: relative;
            overflow: hidden;
            width: min(330px, 100%);
            padding: 26px 22px 20px;
            border: 1px solid rgba(25, 195, 125, 0.30);
            border-radius: 24px;
            background: radial-gradient(circle at 50% 0%, #1b4b3d 0%, #0d1b2d 48%, #07111f 100%);
            box-shadow: 0 22px 50px rgba(0, 0, 0, 0.38);
            text-align: center;
        }

        .welcome-celebration-card::after {
            content: "";
            position: absolute;
            inset: auto 0 0;
            height: 44px;
            background: linear-gradient(180deg, transparent, rgba(0, 0, 0, 0.34));
            pointer-events: none;
        }

        .celebration-scene {
            position: relative;
            z-index: 1;
            height: 176px;
            margin: -16px 0 4px;
        }

        .celebration-scene::before,
        .celebration-scene::after {
            content: "";
            position: absolute;
            top: -34px;
            width: 115px;
            height: 225px;
            opacity: 0.68;
            filter: blur(2px);
            pointer-events: none;
        }

        .celebration-scene::before {
            left: -18px;
            background: linear-gradient(145deg, rgba(255, 245, 188, 0.63), transparent 68%);
            transform: rotate(-16deg);
        }

        .celebration-scene::after {
            right: -18px;
            background: linear-gradient(215deg, rgba(181, 255, 218, 0.48), transparent 68%);
            transform: rotate(16deg);
        }

        .celebration-player {
            position: relative;
            z-index: 1;
            width: 160px;
            height: 190px;
            object-fit: contain;
            animation: player-entrance 0.85s cubic-bezier(0.2, 0.85, 0.3, 1) both;
        }

        .welcome-celebration h2 {
            position: relative;
            z-index: 1;
            margin: 2px 0 7px;
            font-size: 25px;
        }

        .welcome-celebration p {
            position: relative;
            z-index: 1;
            margin: 0;
            color: var(--muted);
            font-size: 13px;
        }

        .celebration-skip {
            position: relative;
            z-index: 1;
            margin-top: 18px;
            border: 0;
            background: transparent;
            color: var(--accent);
            font: inherit;
            font-size: 12px;
            font-weight: 800;
        }

        @keyframes player-entrance {
            from { opacity: 0; transform: translateX(52px) translateY(10px) scale(0.90); }
            to { opacity: 1; transform: translateX(0) translateY(0) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .celebration-player {
                animation: none;
            }
        }

        @media (max-width: 360px) {
            .app {
                padding-left: 10px;
                padding-right: 10px;
            }

            .team-name-card {
                font-size: 12px;
            }

            .welcome h2 {
                font-size: 20px;
            }
        }

        /* DESKTOP WEBSITE */

        @media (min-width: 900px) {
            body {
                min-height: 100vh;
                background:
                    radial-gradient(circle at 12% 0%, rgba(25, 195, 125, 0.10), transparent 30%),
                    radial-gradient(circle at 88% 8%, rgba(100, 165, 255, 0.09), transparent 28%),
                    var(--bg);
            }

            .app {
                display: grid;
                grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
                column-gap: 28px;
                max-width: 1180px;
                padding: 28px 28px 42px;
            }

            .pull-indicator,
            .header,
            .welcome,
            .footer {
                grid-column: 1 / -1;
            }

            .header {
                margin-bottom: 26px;
            }

            .logo {
                width: 54px;
                height: 54px;
                border-radius: 17px;
                font-size: 29px;
            }

            .brand h1 {
                font-size: 23px;
            }

            .brand p {
                font-size: 12px;
            }

            .welcome {
                min-height: 150px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                padding: 28px 32px;
                margin-bottom: 28px;
                background:
                    radial-gradient(circle at 86% 35%, rgba(25, 195, 125, 0.16), transparent 28%),
                    linear-gradient(125deg, #0d352e, #0d1b2d 62%);
            }

            .welcome h2 {
                margin-top: 9px;
                font-size: 34px;
            }

            .welcome p {
                font-size: 15px;
            }

            .featured-match {
                grid-column: 1;
                grid-row: 4 / span 3;
                align-self: start;
                position: sticky;
                top: 24px;
                margin-bottom: 0;
            }

            .filters,
            .match-tools,
            #matchContent {
                grid-column: 2;
            }

            .filters {
                margin-bottom: 14px;
            }

            .filter {
                flex: 1;
                padding: 12px 18px;
                cursor: pointer;
            }

            #matchContent {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 14px;
                align-content: start;
            }

            #matchContent > .section-header,
            #matchContent > .empty {
                grid-column: 1 / -1;
            }

            .match-card {
                height: 100%;
                min-height: 190px;
                margin-bottom: 0;
                padding: 18px;
            }

            .match-card[data-match-id]:hover {
                transform: translateY(-3px);
                border-color: rgba(25, 195, 125, 0.38);
                box-shadow: 0 14px 28px rgba(0, 0, 0, 0.20);
            }

            .match-modal {
                align-items: center;
                padding: 30px;
            }

            .match-modal-sheet {
                max-width: 560px;
                padding: 22px 24px 28px;
                border-radius: 24px;
            }

            .footer {
                margin-top: 32px;
                padding-top: 20px;
                border-top: 1px solid var(--border);
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="pull-indicator" id="pullIndicator" aria-live="polite">↓ Pull down to refresh</div>

    <!-- HEADER -->
    <div class="header">

        <div class="brand">
            <div class="logo">🏏</div>

            <div>
                <h1>Cricket Match Timings</h1>
                <p>Match schedules</p>
            </div>
        </div>

        <div class="header-actions">
            <button class="notification" type="button" aria-label="Notifications">🔔</button>
            <button class="menu-button" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false">☰</button>

            <div class="menu-panel" id="menuPanel" aria-label="Menu">
                <div class="menu-title">Menu</div>
                <button class="menu-item" type="button"><span>⭐ My favourites</span><span>Coming soon</span></button>
                <button class="menu-item" type="button"><span>🔔 Match reminders</span><span>Coming soon</span></button>
                <button class="menu-item" type="button"><span>ℹ️ About this app</span><span>Coming soon</span></button>
            </div>
        </div>

    </div>


    <!-- WELCOME -->
    <div class="welcome">

        <div class="welcome-label">
            Cricket Schedule
        </div>

        <h2>Never miss a match.</h2>

        <p>
            Get daily fixtures and upcoming matches.
        </p>

    </div>


    <!-- UPCOMING BIG MATCHES -->
    <section class="featured-match" id="featuredMatch" aria-live="polite">
        <div id="featuredMatchContent"></div>
    </section>


   <!-- FILTERS -->
<div class="filters">

    function formatLocalDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
}

function formatMatchTime(time) {
    if (!time) return "Time not set";

    const [hoursText, minutes] = time.split(":");
    const hours = Number(hoursText);
    const period = hours >= 12 ? "PM" : "AM";
    const displayHours = hours % 12 || 12;

    return `${displayHours}:${minutes} ${period}`;
}

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>'"]/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
    })[character]);
}

function formatIndiaDate(date) {
    const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Kolkata",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }).formatToParts(date);
    const values = Object.fromEntries(parts.map(part => [part.type, part.value]));

    return `${values.year}-${values.month}-${values.day}`;
}

function formatDateLabel(dateText) {
    return new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Kolkata",
        weekday: "short",
        day: "numeric",
        month: "short"
    }).format(new Date(`${dateText}T00:00:00+05:30`));
}

function getMatchStart(match) {
    if (!match.match_date || !match.match_time) return null;

    const time = String(match.match_time).slice(0, 5);
    const start = new Date(`${match.match_date}T${time}:00+05:30`);

    return Number.isNaN(start.getTime()) ? null : start;
}

function formatCountdown(start) {
    const remaining = start.getTime() - Date.now();

    if (remaining <= 0) return "Starting now";

    const totalSeconds = Math.ceil(remaining / 1000);
    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;
    const parts = [];

    if (days) parts.push(`${days}d`);
    if (hours || days) parts.push(`${hours}h`);
    parts.push(`${minutes}m`);
    parts.push(`${seconds}s`);

    return `Starts in ${parts.join(" ")}`;
}

async function subscribeToReminder(button) {
    const matchId = Number(button.dataset.reminderMatchId);
    const initData = window.Telegram?.WebApp?.initData;

    if (!initData) {
        button.textContent = "Open this app through Telegram to set a reminder";
        return;
    }

    if (!Number.isSafeInteger(matchId) || matchId <= 0) return;

    button.disabled = true;
    button.textContent = "Setting reminder…";

    try {
        const response = await fetch(REMINDER_FUNCTION_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData, matchId })
        });
        const result = await response.json().catch(() => ({}));

        if (!response.ok) {
            throw new Error(result.error || "Could not set the reminder.");
        }

        button.textContent = result.alreadyExists
            ? "🔔 Reminder already set"
            : "✓ Reminder set for 30 minutes before";
    } catch (error) {
        button.disabled = false;
        button.textContent = error.message || "Try setting the reminder again";
    }
}

function updateLastUpdated() {

    } else {
        const elapsedMinutes = Math.floor(elapsedSeconds / 60);
        lastUpdated.textContent = `Last updated ${elapsedMinutes}m ago`;
    }
}

async function loadBigMatches() {

        .from("matches")

        .filter(({ start }) => start && start.getTime() > Date.now())

const pullIndicator = document.getElementById("pullIndicator");
const pullThreshold = 72;
let touchStartY = null;
let pullDistance = 0;

function resetPullIndicator() {
    pullIndicator.classList.remove("visible", "ready");
    pullIndicator.textContent = "↓ Pull down to refresh";
    touchStartY = null;
    pullDistance = 0;
}

document.addEventListener("touchstart", event => {
    if (window.scrollY <= 0 && event.touches.length === 1) {
        touchStartY = event.touches[0].clientY;
    }
}, { passive: true });

document.addEventListener("touchmove", event => {
    if (touchStartY === null || event.touches.length !== 1) return;

    pullDistance = Math.max(0, event.touches[0].clientY - touchStartY);
    if (pullDistance === 0) return;

    pullIndicator.classList.add("visible");
    const isReady = pullDistance >= pullThreshold;
    pullIndicator.classList.toggle("ready", isReady);
    pullIndicator.textContent = isReady ? "↑ Release to refresh" : "↓ Pull down to refresh";
}, { passive: true });

document.addEventListener("touchend", async () => {
    if (pullDistance >= pullThreshold) {
        pullIndicator.classList.add("visible", "ready");
        pullIndicator.textContent = "Refreshing matches…";
        await refreshMatches();
    }

    resetPullIndicator();
}, { passive: true });

document.addEventListener("touchcancel", resetPullIndicator, { passive: true });
