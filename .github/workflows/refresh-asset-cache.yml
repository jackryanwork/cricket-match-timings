name: Refresh asset cache versions

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v5

      - name: Add commit-based asset versions
        env:
          ASSET_VERSION: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const version = process.env.ASSET_VERSION.slice(0, 12);

          for (const file of fs.readdirSync(".").filter(name => name.endsWith(".html"))) {
            const filePath = path.join(".", file);
            const original = fs.readFileSync(filePath, "utf8");
            const updated = original
              .replace(/css\/style\.css\?v=[^"'&]+/g, `css/style.css?v=${version}`)
              .replace(/js\/script\.js\?v=[^"'&]+/g, `js/script.js?v=${version}`);
            if (updated !== original) fs.writeFileSync(filePath, updated);
          }
          NODE

      - name: Commit refreshed asset versions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh asset cache versions"
          git push
