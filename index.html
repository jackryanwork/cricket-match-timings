<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cricket Match Timings</title>

    <!-- Telegram Mini App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f2f4f7;
            color: #17202a;
        }

        .app {
            max-width: 600px;
            margin: 0 auto;
            padding: 18px 14px 30px;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #0b3d91, #1261c9);
            color: white;
            border-radius: 18px;
            padding: 22px 18px;
            margin-bottom: 18px;
            box-shadow: 0 8px 20px rgba(0, 60, 150, 0.18);
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
            font-weight: 800;
        }

        .header p {
            margin: 7px 0 0;
            opacity: 0.9;
            font-size: 14px;
        }

        /* Date section */
        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 2px 12px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 19px;
        }

        .date {
            font-size: 13px;
            color: #667085;
        }

        /* Match card */
        .match-card {
            background: white;
            border-radius: 17px;
            padding: 17px;
            margin-bottom: 13px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.07);
        }

        .competition {
            font-size: 12px;
            font-weight: 700;
            color: #1261c9;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 14px;
        }

        .teams {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .team {
            width: 40%;
            text-align: center;
            font-weight: 750;
            font-size: 16px;
        }

        .team-icon {
            display: block;
            font-size: 30px;
            margin-bottom: 7px;
        }

        .vs {
            font-size: 12px;
            font-weight: 800;
            color: #8a94a6;
        }

        .match-info {
            margin-top: 15px;
            padding-top: 13px;
            border-top: 1px solid #edf0f4;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .time {
            font-size: 17px;
            font-weight: 800;
        }

        .timezone {
            font-size: 11px;
            color: #7a8494;
            margin-left: 4px;
        }

        .status {
            background: #e8f5e9;
            color: #218739;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .footer {
            text-align: center;
            color: #8a94a6;
            font-size: 11px;
            margin-top: 22px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>🏏 Cricket Match Timings</h1>
        <p>Find today's cricket matches and timings</p>
    </div>

    <div class="section-title">
        <h2>Today's Matches</h2>
        <span class="date">28 Aug 2026</span>
    </div>

    <!-- Match 1 -->
    <div class="match-card">

        <div class="competition">
            T20 International
        </div>

        <div class="teams">

            <div class="team">
                <span class="team-icon">🇮🇳</span>
                India
            </div>

            <div class="vs">
                VS
            </div>

            <div class="team">
                <span class="team-icon">🇦🇺</span>
                Australia
            </div>

        </div>

        <div class="match-info">
            <div class="time">
                🕐 7:30 PM
                <span class="timezone">IST</span>
            </div>

            <div class="status">
                UPCOMING
            </div>
        </div>

    </div>

    <!-- Match 2 -->
    <div class="match-card">

        <div class="competition">
            ODI
        </div>

        <div class="teams">

            <div class="team">
                <span class="team-icon">🇬🇧</span>
                England
            </div>

            <div class="vs">
                VS
            </div>

            <div class="team">
                <span class="team-icon">🇿🇦</span>
                South Africa
            </div>

        </div>

        <div class="match-info">
            <div class="time">
                🕐 10:00 PM
                <span class="timezone">IST</span>
            </div>

            <div class="status">
                UPCOMING
            </div>
        </div>

    </div>

    <div class="footer">
        Cricket Match Timings
    </div>

</div>

</body>
</html>
