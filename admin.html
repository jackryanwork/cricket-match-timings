}

async function sendBroadcast() {
    const message = document.getElementById("broadcastMessage").value.trim();
    const mediaInput = document.getElementById("broadcastMedia");
    const media = mediaInput.files[0] || null;
    const audience = document.getElementById("broadcastAudience").value;
    const button = document.getElementById("broadcastButton");
    const status = document.getElementById("broadcastStatus");

    status.className = "broadcast-status";
    if (!message && !media) {
        status.textContent = "Write a message or attach a media file before sending.";
        status.classList.add("error");
        return;
    }

    if (media && media.size > 8 * 1024 * 1024) {
        status.textContent = "Media must be 8 MB or smaller.";
        status.classList.add("error");
        return;
    }

    if (media && message.length > 1024) {
        status.textContent = "A media caption must be 1,024 characters or fewer.";
        status.classList.add("error");
        return;
    }

    const audienceLabel = audience === "alerts"
        ? "all alert-enabled users"
        : "all bot users";
    if (!confirm(`Send this message to ${audienceLabel}?`)) return;

    const { data: sessionData } = await supabaseClient.auth.getSession();
    const accessToken = sessionData.session?.access_token;
    if (!accessToken) {
        status.textContent = "Your admin session expired. Please log in again.";
        status.classList.add("error");
        return;
    }

    button.disabled = true;
    button.textContent = "Sending...";
    status.textContent = "Broadcast is being delivered. Keep this page open.";

    try {
        const formData = new FormData();
        formData.append("message", message);
        formData.append("audience", audience);
        if (media) formData.append("media", media, media.name);

        const response = await fetch(BROADCAST_FUNCTION_URL, {
            method: "POST",
            headers: {
                "Authorization": `Bearer ${accessToken}`,
                "apikey": SUPABASE_KEY
            },
            body: formData
        });
        const result = await response.json().catch(() => ({}));

        if (!response.ok) throw new Error(result.error || "Broadcast failed.");

        status.textContent = `Complete: ${result.sent} sent, ${result.failed} failed, ${result.blocked} blocked.`;
        status.classList.add("success");
        if (result.sent > 0) {
            document.getElementById("broadcastMessage").value = "";
            mediaInput.value = "";
        }
    } catch (error) {
        status.textContent = error.message || "Broadcast failed.";
        status.classList.add("error");
    } finally {
        button.disabled = false;
        button.textContent = "📣 Send Broadcast";
    }
}

async function saveMatch() {

    const team1 = document.getElementById("team1").value.trim();
    const team2 = document.getElementById("team2").value.trim();
    const date = document.getElementById("matchDate").value;
    const timeInput = document.getElementById("matchTime").value.trim();
    const period = document.getElementById("matchPeriod").value;
    const selectedCompetition = document.getElementById("competition").value;
    const customCompetition = document.getElementById("customCompetition").value.trim();
    const competition = customCompetition || selectedCompetition;
    const venue = document.getElementById("venue").value.trim();
    const isBigMatch = document.getElementById("isBigMatch").checked;

    if (!team1 || !team2 || !date || !timeInput) {

        alert("Please fill Team 1, Team 2, Date and Time.");
        return;

    }

    const time = convertTo24HourTime(timeInput, period);

    if (!time) {
        alert("Please enter a valid time, for example 7:30, and select AM or PM.");
        return;
    }

    const matchPayload = {
        team1: team1,
        team2: team2,
        match_date: date,
        match_time: time,
        competition: competition,
        venue: venue,
        is_big_match: isBigMatch
    };

    const isEditing = editingMatchId !== null;
    const query = isEditing
        ? supabaseClient.from("matches").update(matchPayload).eq("id", editingMatchId)
        : supabaseClient.from("matches").insert([matchPayload]);
    const { error } = await query;

    if (error) {
        alert(`Error ${isEditing ? "updating" : "saving"} match: ${error.message}`);
        return;
    }

    cancelEdit();
    loadSavedMatches();
    alert(isEditing ? "Match updated successfully! ✅" : "Match saved successfully!");
}

function convertTo24HourTime(timeInput, period) {
    const match = timeInput.match(/^(\d{1,2}):(\d{2})$/);

    if (!match) return null;

    const hours = Number(match[1]);
    const minutes = Number(match[2]);

    if (hours < 1 || hours > 12 || minutes > 59) return null;

    const hours24 = (hours % 12) + (period === "PM" ? 12 : 0);
    return `${String(hours24).padStart(2, "0")}:${String(minutes).padStart(2, "0")}`;
}

function convertFrom24HourTime(timeValue) {
    const [hoursText, minutes = "00"] = String(timeValue || "").slice(0, 5).split(":");
    const hours24 = Number(hoursText);
    const period = hours24 >= 12 ? "PM" : "AM";
    const hours12 = hours24 % 12 || 12;

    return {
        time: `${hours12}:${minutes}`,
        period: period
    };
}

function resetMatchForm() {
    document.getElementById("team1").value = "";
    document.getElementById("team2").value = "";
    document.getElementById("matchDate").value = "";
    document.getElementById("matchTime").value = "";
    document.getElementById("matchPeriod").value = "AM";
    document.getElementById("competition").value = "";
    document.getElementById("customCompetition").value = "";
    document.getElementById("venue").value = "";
    document.getElementById("isBigMatch").checked = false;
}

function cancelEdit() {
    editingMatchId = null;
    resetMatchForm();
    document.getElementById("saveMatchButton").textContent = "➕ Save Match";
    document.getElementById("cancelEditButton").style.display = "none";
}

function editMatch(id) {
    const match = savedMatchesById.get(Number(id));
    if (!match) return;

    editingMatchId = Number(id);
    document.getElementById("team1").value = match.team1 || "";
    document.getElementById("team2").value = match.team2 || "";
    document.getElementById("matchDate").value = match.match_date || "";

    const convertedTime = convertFrom24HourTime(match.match_time);
    document.getElementById("matchTime").value = convertedTime.time;
    document.getElementById("matchPeriod").value = convertedTime.period;

    const competitionSelect = document.getElementById("competition");
    const competitionExists = [...competitionSelect.options]
        .some(option => option.value === (match.competition || ""));
    competitionSelect.value = competitionExists ? match.competition : "Other";
    document.getElementById("customCompetition").value = competitionExists ? "" : (match.competition || "");
    document.getElementById("venue").value = match.venue || "";
    document.getElementById("isBigMatch").checked = Boolean(match.is_big_match);

    document.getElementById("saveMatchButton").textContent = "✅ Update Match";
    document.getElementById("cancelEditButton").style.display = "block";
    document.getElementById("addMatchCard").scrollIntoView({ behavior: "smooth", block: "start" });
}

async function toggleBigMatch(id, isCurrentlyBig) {
    const { error } = await supabaseClient
        .from("matches")
        .update({ is_big_match: !isCurrentlyBig })
        .eq("id", id);

    if (error) {
        alert("Error changing Big Match status: " + error.message);
        return;
    }

    alert(isCurrentlyBig
        ? "Match removed from Upcoming Big Matches."
        : "Match added to Upcoming Big Matches! ⭐");
    loadSavedMatches();
}

function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>'"]/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "'": "&#39;",
        '"': "&quot;"
    })[character]);
}

function formatIndiaDate(date = new Date()) {
    const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: "Asia/Kolkata",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
    }).formatToParts(date);
    const values = Object.fromEntries(parts.map(part => [part.type, part.value]));

    return `${values.year}-${values.month}-${values.day}`;
}

function populateCompetitionOptions(matches) {
    const select = document.getElementById("competition");
    const defaultCompetitions = new Set([
        "T20 International",
        "ODI",
        "Test",
        "T20 League",
        "Other"
    ]);

    select.querySelectorAll("option[data-saved-competition]").forEach(option => option.remove());

    const savedCompetitions = [...new Set(
        matches
            .map(match => (match.competition || "").trim())
            .filter(competition => competition && !defaultCompetitions.has(competition))
    )].sort();

    savedCompetitions.forEach(competition => {
        const option = document.createElement("option");
        option.value = competition;
        option.textContent = competition;
        option.dataset.savedCompetition = "true";
        select.appendChild(option);
    });
}


async function loadSavedMatches() {

    const container =
        document.getElementById("savedMatches");

    container.innerHTML = "Loading...";

    const { data: matches, error } = await supabaseClient
        .from("matches")
        .select("*")
        .gte("match_date", formatIndiaDate())
        .order("match_date", { ascending: true })
        .order("match_time", { ascending: true });

    if (error) {

        container.innerHTML =
            '<div class="empty">Error loading matches: ' +
            escapeHtml(error.message) +
            '</div>';

        return;

    }

    populateCompetitionOptions(matches || []);
    savedMatchesById = new Map((matches || []).map(match => [Number(match.id), match]));

    if (!matches || matches.length === 0) {

        container.innerHTML =
            '<div class="empty">No matches saved yet.</div>';

        return;

    }

    container.innerHTML = "";

    matches.forEach(function(match) {

        container.innerHTML += `

            <div class="match-item">

                <strong>
                    ${escapeHtml(match.team1)} vs ${escapeHtml(match.team2)}
                </strong>

                <br><br>

                📅 ${escapeHtml(match.match_date)}

                <br>

                ⏰ ${escapeHtml(match.match_time)}

                <br>

                🏏 ${escapeHtml(match.competition || "No competition")}

                <br>

                🏟️ ${escapeHtml(match.venue || "No venue")}

                ${match.is_big_match ? '<br><span class="big-match-badge">⭐ BIG MATCH</span>' : ''}

                <div class="match-actions">
                    <button class="edit-match-button" onclick="editMatch(${Number(match.id)})">
                        ✏️ Edit
                    </button>

                    <button class="big-match-button" onclick="toggleBigMatch(${Number(match.id)}, ${Boolean(match.is_big_match)})">
                        ${match.is_big_match ? "⭐ Remove Big Match" : "⭐ Add to Big Match"}
                    </button>

                    <button class="delete-match-button" onclick="deleteMatch(${Number(match.id)})">
                        🗑️ Delete Match
                    </button>
                </div>

            </div>

        `;

    });

}

async function deleteMatch(id) {

    const confirmDelete = confirm(
        "Are you sure you want to delete this match?"
    );

    if (!confirmDelete) {
        return;
    }

    const { error } = await supabaseClient
        .from("matches")
        .delete()
        .eq("id", id);

    if (error) {
        alert("Error deleting match: " + error.message);
        return;
    }

    alert("Match deleted successfully! ✅");

    loadSavedMatches();
}
</script>
